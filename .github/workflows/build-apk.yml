name: Build APK

'on':
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with the APK'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release tag (e.g. v1.0.0). Defaults to v<version> if empty.'
        required: false
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev \
            cmake libffi-dev libssl-dev libltdl-dev

      - name: Install Python Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade "cython<3.0" buildozer virtualenv

      - name: Configure Android SDK & Resolve AIDL
        run: |
          # 1. Take ownership of Android SDK directory
          sudo chown -R $USER:$USER "$ANDROID_HOME"

          # 2. Add Android SDK commandline tools and platform tools to PATH
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

          # 3. Accept all Android SDK licenses
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | sdkmanager --licenses || true

          # 4. Install required platform-tools, Android platform, and build-tools
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

          # 5. Create legacy tools/bin symlink expected by Buildozer
          mkdir -p "$ANDROID_HOME/tools"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/tools/bin"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/lib" "$ANDROID_HOME/tools/lib"
          echo "$ANDROID_HOME/tools/bin" >> $GITHUB_PATH

          # 6. Locate and configure AIDL explicitly
          AIDL_EXEC=$(find "$ANDROID_HOME/build-tools" -name aidl -type f -perm /111 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$AIDL_EXEC" ]; then
            echo "::error::AIDL executable could not be found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          echo "Found AIDL executable at: $AIDL_EXEC"

          BUILD_TOOLS_DIR=$(dirname "$AIDL_EXEC")
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH

          # Create symlinks in system bin locations so aidl is directly executable anywhere
          sudo ln -sf "$AIDL_EXEC" /usr/local/bin/aidl
          sudo ln -sf "$AIDL_EXEC" /usr/bin/aidl

          # Verify AIDL is accessible
          which aidl
          aidl --version || true

          # 7. Pre-link Android SDK to Buildozer directory to ensure toolchain compatibility
          mkdir -p ~/.buildozer/android/platform
          ln -sf "$ANDROID_HOME" ~/.buildozer/android/platform/android-sdk

          # Copy accepted licenses to Buildozer's SDK path
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          cp -r "$ANDROID_HOME/licenses/"* ~/.buildozer/android/platform/android-sdk/licenses/ 2>/dev/null || true

          # 8. Verify sdkmanager path for Buildozer
          echo "Verifying sdkmanager location for Buildozer:"
          ls -la ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --version || true

      - name: Locate App Directory
        id: app_dir
        run: |
          if [ -f "tictactoemapp/buildozer.spec" ]; then
            echo "path=tictactoemapp" >> $GITHUB_OUTPUT
            echo "Application located in subdirectory: tictactoemapp"
          elif [ -f "buildozer.spec" ]; then
            echo "path=." >> $GITHUB_OUTPUT
            echo "Application located in root directory: ."
          else
            echo "::error::Could not locate buildozer.spec"
            exit 1
          fi

      - name: Extract App Version & Metadata
        id: app_info
        working-directory: ${{ steps.app_dir.outputs.path }}
        run: |
          VERSION=$(grep -E "^version[[:space:]]*=" buildozer.spec | awk -F '=' '{print $2}' | tr -d ' ')
          TITLE=$(grep -E "^title[[:space:]]*=" buildozer.spec | awk -F '=' '{print $2}' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          echo "version=${VERSION:-1.0.0}" >> $GITHUB_OUTPUT
          echo "title=${TITLE:-Tic Tac Toe}" >> $GITHUB_OUTPUT

      - name: Build Android APK
        working-directory: ${{ steps.app_dir.outputs.path }}
        run: |
          yes | buildozer -v android debug

      - name: Verify Generated APK
        run: |
          APP_PATH="${{ steps.app_dir.outputs.path }}"
          if [ ! -d "$APP_PATH/bin" ] || [ -z "$(ls -A $APP_PATH/bin/*.apk 2>/dev/null)" ]; then
            echo "::error::No APK file found in $APP_PATH/bin/ directory after build."
            exit 1
          fi
          echo "Built APK artifacts:"
          ls -lh $APP_PATH/bin/*.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-python-app-apk
          path: ${{ steps.app_dir.outputs.path }}/bin/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.create_release == true || inputs.release_tag != '') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || format('v{0}', steps.app_info.outputs.version) }}
          name: ${{ inputs.release_tag != '' && inputs.release_tag || format('{0} v{1}', steps.app_info.outputs.title, steps.app_info.outputs.version) }}
          files: ${{ steps.app_dir.outputs.path }}/bin/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
